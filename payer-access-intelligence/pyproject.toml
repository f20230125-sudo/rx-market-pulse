[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payer-access-intelligence"
version = "0.1.0"
description = "Reproducible Medicare PDP access analysis for BELSOMRA, DAYVIGO and QUVIVIQ"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3,<2", "requests>=2.32,<3", "XlsxWriter>=3.2,<4", "openpyxl>=3.1,<4", "PyMuPDF>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
windows = ["pywin32>=308; sys_platform == 'win32'"]

[project.scripts]
pai = "pai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
