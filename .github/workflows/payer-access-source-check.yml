name: Payer access original-source check
on:
  push:
    branches: [work/payer-access-source-check]
    paths: [.github/workflows/payer-access-source-check.yml]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Reconstruct acquisition code
        shell: python
        run: |
          import json, pathlib
          files=json.loads("{\"src/pai/__init__.py\":\"\\\"\\\"\\\"Public-source payer access analytics. No patient-level data or sales estimates.\\\"\\\"\\\"\\n\",\"src/pai/config.py\":\"from pathlib import Path\\n\\nROOT = Path(__file__).resolve().parents[2]\\nMONTHS = (\\\"2026-01\\\", \\\"2026-08\\\")\\nCONTRACT_YEAR = \\\"2026\\\"\\nBRANDS = {\\n    \\\"BELSOMRA\\\": {\\\"ingredient\\\": \\\"suvorexant\\\", \\\"strengths\\\": [5, 10, 15, 20], \\\"setid\\\": \\\"e5b72731-1acb-45b7-9c13-290ad12d3951\\\"},\\n    \\\"DAYVIGO\\\": {\\\"ingredient\\\": \\\"lemborexant\\\", \\\"strengths\\\": [5, 10], \\\"setid\\\": \\\"7074cb65-77b3-45d2-8e8d-da8dc0f70bfd\\\"},\\n    \\\"QUVIVIQ\\\": {\\\"ingredient\\\": \\\"daridorexant\\\", \\\"strengths\\\": [25, 50], \\\"setid\\\": \\\"3a2d1503-b816-40c9-9fac-7e03c5a3bcef\\\"},\\n}\\nREGIONS = {\\n    1: \\\"NH / ME\\\", 2: \\\"CT / MA / RI / VT\\\", 3: \\\"New York\\\", 4: \\\"New Jersey\\\",\\n    5: \\\"DE / DC / MD\\\", 6: \\\"PA / WV\\\", 7: \\\"Virginia\\\", 8: \\\"North Carolina\\\",\\n    9: \\\"South Carolina\\\", 10: \\\"Georgia\\\", 11: \\\"Florida\\\", 12: \\\"AL / TN\\\", 13: \\\"Michigan\\\",\\n    14: \\\"Ohio\\\", 15: \\\"IN / KY\\\", 16: \\\"Wisconsin\\\", 17: \\\"Illinois\\\", 18: \\\"Missouri\\\",\\n    19: \\\"Arkansas\\\", 20: \\\"Mississippi\\\", 21: \\\"Louisiana\\\", 22: \\\"Texas\\\", 23: \\\"Oklahoma\\\",\\n    24: \\\"Kansas\\\", 25: \\\"IA / MN / MT / NE / ND / SD / WY\\\", 26: \\\"New Mexico\\\",\\n    27: \\\"Colorado\\\", 28: \\\"Arizona\\\", 29: \\\"Nevada\\\", 30: \\\"OR / WA\\\", 31: \\\"ID / UT\\\",\\n    32: \\\"California\\\", 33: \\\"Hawaii\\\", 34: \\\"Alaska\\\", 35: \\\"American Samoa\\\",\\n    36: \\\"Guam\\\", 37: \\\"Northern Mariana Islands\\\", 38: \\\"Puerto Rico\\\", 39: \\\"US Virgin Islands\\\",\\n}\\nLAYOUT = \\\"https://data.cms.gov/sites/default/files/2025-10/0564eb37-402d-4110-bd98-2d5399dc30e7/PUFRecordLayout-2026.pdf\\\"\\nAGREEMENT = \\\"https://data.cms.gov/sites/default/files/2023-10/4eeb19e1-525b-4a4e-9766-b33ff084fc5c/AGREEMENT-FOR-USE.pdf\\\"\\nFORMULARY_LANDING = \\\"https://data.cms.gov/provider-summary-by-type-of-service/medicare-part-d-prescribers/monthly-prescription-drug-plan-formulary-and-pharmacy-network-information\\\"\\nENROLLMENT_LANDING = \\\"https://www.cms.gov/data-research/statistics-trends-and-reports/medicare-advantagepart-d-contract-and-enrollment-data/monthly-enrollment-plan\\\"\\n\",\"src/pai/io.py\":\"import csv\\nimport hashlib\\nimport json\\nfrom pathlib import Path\\n\\n\\ndef dump_json(path, value):\\n    path = Path(path)\\n    path.parent.mkdir(parents=True, exist_ok=True)\\n    path.write_text(json.dumps(value, indent=2, ensure_ascii=False, default=str) + \\\"\\\\n\\\", encoding=\\\"utf-8\\\")\\n\\n\\ndef sha256(path):\\n    h = hashlib.sha256()\\n    with Path(path).open(\\\"rb\\\") as f:\\n        for chunk in iter(lambda: f.read(1024 * 1024), b\\\"\\\"):\\n            h.update(chunk)\\n    return h.hexdigest()\\n\\n\\ndef rows_csv(path, rows, columns=None):\\n    path = Path(path)\\n    path.parent.mkdir(parents=True, exist_ok=True)\\n    rows = list(rows)\\n    columns = columns or (list(rows[0]) if rows else [])\\n    with path.open(\\\"w\\\", encoding=\\\"utf-8-sig\\\", newline=\\\"\\\") as f:\\n        w = csv.DictWriter(f, fieldnames=columns)\\n        w.writeheader()\\n        w.writerows(rows)\\n\\n\\ndef query_dicts(con, sql, args=None):\\n    cur = con.execute(sql, args or [])\\n    names = [x[0] for x in cur.description]\\n    return [dict(zip(names, row)) for row in cur.fetchall()]\\n\",\"src/pai/fetch.py\":\"\\\"\\\"\\\"Acquire immutable original sources; never substitute demo data on failure.\\\"\\\"\\\"\\nimport csv\\nimport io\\nimport json\\nimport re\\nimport shutil\\nimport zipfile\\nfrom datetime import datetime, timezone\\nfrom html.parser import HTMLParser\\nfrom pathlib import Path\\nfrom urllib.parse import urljoin, urlparse\\n\\nimport requests\\nfrom requests.adapters import HTTPAdapter\\nfrom urllib3.util.retry import Retry\\n\\nfrom .config import AGREEMENT, BRANDS, CONTRACT_YEAR, ENROLLMENT_LANDING, LAYOUT, MONTHS, ROOT\\nfrom .io import dump_json, sha256\\n\\n\\ndef session():\\n    s = requests.Session()\\n    s.headers[\\\"User-Agent\\\"] = \\\"PayerAccessIntelligence/0.1 (independent public-data portfolio)\\\"\\n    s.mount(\\\"https://\\\", HTTPAdapter(max_retries=Retry(total=3, backoff_factor=1, status_forcelist=[429, 500, 502, 503, 504])))\\n    return s\\n\\n\\nclass Links(HTMLParser):\\n    def __init__(self):\\n        super().__init__()\\n        self.urls = []\\n\\n    def handle_starttag(self, tag, attrs):\\n        if tag == \\\"a\\\":\\n            self.urls.extend(v for k, v in attrs if k == \\\"href\\\" and v)\\n\\n\\ndef formulary_url(index, month):\\n    candidates = set()\\n    for dataset in index.get(\\\"dataset\\\", []):\\n        if dataset.get(\\\"title\\\", \\\"\\\").split(\\\" : \\\")[0] != \\\"Monthly Prescription Drug Plan Formulary and Pharmacy Network Information\\\":\\n            continue\\n        for dist in dataset.get(\\\"distribution\\\", []):\\n            url = dist.get(\\\"downloadURL\\\", \\\"\\\")\\n            name = url.rsplit(\\\"/\\\", 1)[-1]\\n            if re.search(rf\\\"^{CONTRACT_YEAR}[_.]{month.replace('-', '')}\\\\d{{2}}\\\\.zip$\\\", name):\\n                candidates.add(url)\\n    if len(candidates) != 1:\\n        raise ValueError(f\\\"Expected one official {month} CY{CONTRACT_YEAR} bundle, found {len(candidates)}. Supply --source-map with verified URLs.\\\")\\n    return candidates.pop()\\n\\n\\ndef download(s, url, target):\\n    target = Path(target)\\n    target.parent.mkdir(parents=True, exist_ok=True)\\n    part = target.with_suffix(target.suffix + \\\".part\\\")\\n    with s.get(url, stream=True, timeout=(30, 180)) as r:\\n        r.raise_for_status()\\n        with part.open(\\\"wb\\\") as f:\\n            for chunk in r.iter_content(1024 * 1024):\\n                f.write(chunk)\\n    part.replace(target)\\n    return {\\\"url\\\": url, \\\"path\\\": str(target.relative_to(ROOT)), \\\"sha256\\\": sha256(target), \\\"bytes\\\": target.stat().st_size,\\n            \\\"fetched_at\\\": datetime.now(timezone.utc).isoformat()}\\n\\n\\ndef unpack_tables(path, dest):\\n    \\\"\\\"\\\"CMS bundles contain nested archives. Ignore the multi-GB pharmacy network.\\\"\\\"\\\"\\n    dest.mkdir(parents=True, exist_ok=True)\\n    selected = {}\\n\\n    def scan(z):\\n        for member in z.infolist():\\n            name = member.filename.lower()\\n            if member.is_dir() or \\\"sample\\\" in name:\\n                continue\\n            kind = next((k for k, terms in {\\\"plans\\\": [\\\"plan information\\\", \\\"plan_information\\\"],\\n                                          \\\"formulary\\\": [\\\"basic drugs formulary\\\", \\\"basic_drugs_formulary\\\"],\\n                                          \\\"indications\\\": [\\\"indication based\\\", \\\"indication_based\\\"]}.items()\\n                         if any(t in name for t in terms)), None)\\n            if name.endswith(\\\".zip\\\") and kind:\\n                with z.open(member) as src:\\n                    with zipfile.ZipFile(io.BytesIO(src.read())) as nested:\\n                        scan(nested)\\n            elif name.endswith((\\\".txt\\\", \\\".csv\\\")) and kind:\\n                if kind in selected:\\n                    raise ValueError(f\\\"Ambiguous {kind} members in {path}\\\")\\n                out = dest / (kind + \\\".txt\\\")\\n                with z.open(member) as src, out.open(\\\"wb\\\") as f:\\n                    shutil.copyfileobj(src, f)\\n                selected[kind] = {\\\"member\\\": member.filename, \\\"sha256\\\": sha256(out), \\\"bytes\\\": out.stat().st_size}\\n\\n    with zipfile.ZipFile(path) as z:\\n        scan(z)\\n    if not {\\\"plans\\\", \\\"formulary\\\"} <= selected.keys():\\n        raise ValueError(f\\\"Required CMS tables missing in {path}; found {list(selected)}\\\")\\n    return selected\\n\\n\\ndef product_catalog(s, raw):\\n    catalog, records = [], []\\n    for brand, config in BRANDS.items():\\n        label_url = f\\\"https://dailymed.nlm.nih.gov/dailymed/services/v2/spls/{config['setid']}.xml\\\"\\n        records.append(download(s, label_url, raw / \\\"products\\\" / f\\\"{brand}.xml\\\"))\\n        lookup_url = f\\\"https://rxnav.nlm.nih.gov/REST/rxcui.json?name={brand}&search=2\\\"\\n        lookup = s.get(lookup_url, timeout=45)\\n        lookup.raise_for_status()\\n        ids = lookup.json().get(\\\"idGroup\\\", {}).get(\\\"rxnormId\\\", [])\\n        if len(ids) != 1:\\n            raise ValueError(f\\\"Ambiguous RxNorm brand identity: {brand}: {ids}\\\")\\n        url = f\\\"https://rxnav.nlm.nih.gov/REST/rxcui/{ids[0]}/allrelated.json\\\"\\n        target = raw / \\\"products\\\" / f\\\"{brand}_rxnorm.json\\\"\\n        records.append(download(s, url, target))\\n        groups = json.loads(target.read_text())[\\\"allRelatedGroup\\\"].get(\\\"conceptGroup\\\", [])\\n        found = set()\\n        for group in groups:\\n            if group.get(\\\"tty\\\") != \\\"SBD\\\":\\n                continue\\n            for concept in group.get(\\\"conceptProperties\\\", []):\\n                name = concept[\\\"name\\\"]\\n                match = re.search(r\\\" (\\\\d+(?:\\\\.\\\\d+)?) MG Oral Tablet \\\\[\\\" + brand + r\\\"\\\\]$\\\", name, re.I)\\n                if match:\\n                    mg = float(match[1])\\n                    if mg in config[\\\"strengths\\\"]:\\n                        found.add(mg)\\n                        catalog.append({\\\"brand\\\": brand, \\\"ingredient\\\": config[\\\"ingredient\\\"], \\\"strength_mg\\\": mg,\\n                                        \\\"rxcui\\\": concept[\\\"rxcui\\\"], \\\"name\\\": name, \\\"setid\\\": config[\\\"setid\\\"]})\\n        if found != set(config[\\\"strengths\\\"]):\\n            raise ValueError(f\\\"Incomplete marketed-strength catalog for {brand}: {sorted(found)}\\\")\\n    dump_json(raw / \\\"products\\\" / \\\"catalog.json\\\", catalog)\\n    return records\\n\\n\\ndef fetch(source_map=None):\\n    raw = ROOT / \\\"data\\\" / \\\"raw\\\"\\n    raw.mkdir(parents=True, exist_ok=True)\\n    s = session()\\n    overrides = json.loads(Path(source_map).read_text()) if source_map else {}\\n    manifest = {\\\"mode\\\": \\\"real\\\", \\\"contract_year\\\": CONTRACT_YEAR, \\\"sources\\\": [], \\\"snapshots\\\": []}\\n    try:\\n        if not overrides:\\n            meta = s.get(\\\"https://data.cms.gov/data.json\\\", timeout=120)\\n            meta.raise_for_status()\\n            index = meta.json()\\n        else:\\n            index = {}\\n        for month in MONTHS:\\n            folder = raw / month\\n            folder.mkdir(exist_ok=True)\\n            url = overrides.get(month, {}).get(\\\"formulary\\\") or formulary_url(index, month)\\n            if urlparse(url).hostname != \\\"data.cms.gov\\\":\\n                raise ValueError(\\\"Original CMS bundles must be downloaded from data.cms.gov\\\")\\n            source = download(s, url, folder / \\\"formulary.zip\\\")\\n            manifest[\\\"sources\\\"].append(source)\\n            members = unpack_tables(folder / \\\"formulary.zip\\\", folder)\\n            enrollment_url = overrides.get(month, {}).get(\\\"enrollment\\\")\\n            landing = f\\\"{ENROLLMENT_LANDING}/monthly-enrollment-plan-{month}\\\"\\n            if not enrollment_url:\\n                page = s.get(landing, timeout=60)\\n                page.raise_for_status()\\n                links = Links()\\n                links.feed(page.text)\\n                candidates = sorted({urljoin(landing, u) for u in links.urls if u.lower().split('?')[0].endswith(\\\".zip\\\")})\\n                if len(candidates) != 1:\\n                    raise ValueError(f\\\"Ambiguous enrollment download for {month}; supply --source-map\\\")\\n                enrollment_url = candidates[0]\\n            if urlparse(enrollment_url).hostname not in {\\\"www.cms.gov\\\", \\\"cms.gov\\\"}:\\n                raise ValueError(\\\"Enrollment originals must be hosted by CMS\\\")\\n            manifest[\\\"sources\\\"].append(download(s, enrollment_url, folder / \\\"enrollment.zip\\\"))\\n            with zipfile.ZipFile(folder / \\\"enrollment.zip\\\") as z:\\n                files = [n for n in z.namelist() if n.lower().endswith(\\\".csv\\\")]\\n                if len(files) != 1:\\n                    raise ValueError(f\\\"Expected one plan enrollment CSV; found {files}\\\")\\n                with z.open(files[0]) as src, (folder / \\\"enrollment.csv\\\").open(\\\"wb\\\") as f:\\n                    shutil.copyfileobj(src, f)\\n            manifest[\\\"snapshots\\\"].append({\\\"month\\\": month, \\\"formulary_url\\\": url, \\\"enrollment_url\\\": enrollment_url,\\n                                           \\\"members\\\": members, \\\"enrollment_sha256\\\": sha256(folder / \\\"enrollment.csv\\\")})\\n        manifest[\\\"sources\\\"].extend(product_catalog(s, raw))\\n        manifest[\\\"sources\\\"].append(download(s, LAYOUT, raw / \\\"PUFRecordLayout-2026.pdf\\\"))\\n        manifest[\\\"sources\\\"].append(download(s, AGREEMENT, raw / \\\"AGREEMENT-FOR-USE.pdf\\\"))\\n        manifest[\\\"status\\\"] = \\\"complete\\\"\\n        dump_json(raw / \\\"manifest.json\\\", manifest)\\n        print(\\\"Acquired and hashed both original CMS snapshots and product references.\\\")\\n    except Exception as e:\\n        manifest.update(status=\\\"failed\\\", error=str(e))\\n        dump_json(raw / \\\"acquisition-status.json\\\", manifest)\\n        raise\\n\",\"src/pai/normalize.py\":\"\\\"\\\"\\\"Strict identifiers and three-valued restriction flags.\\\"\\\"\\\"\\nimport re\\nimport codecs\\n\\n\\ndef text_encoding(path):\\n    decoder=codecs.getincrementaldecoder('utf-8-sig')('strict')\\n    try:\\n        with path.open('rb') as f:\\n            for chunk in iter(lambda:f.read(1024*1024),b''):\\n                decoder.decode(chunk)\\n            decoder.decode(b'',final=True)\\n        return 'utf-8-sig'\\n    except UnicodeDecodeError:\\n        return 'cp1252'\\n\\n\\ndef identifier(value, width):\\n    value = str(value).strip()\\n    if not value.isdigit() or len(value) > width:\\n        raise ValueError(f\\\"Invalid {width}-digit identifier: {value!r}\\\")\\n    return value.zfill(width)\\n\\n\\ndef ndc11(value):\\n    value = str(value).strip()\\n    if re.fullmatch(r\\\"\\\\d{11}\\\", value):\\n        return value\\n    parts = value.split(\\\"-\\\")\\n    if tuple(map(len, parts)) in {(4, 4, 2), (5, 3, 2), (5, 4, 1), (5, 4, 2)} and all(p.isdigit() for p in parts):\\n        return parts[0].zfill(5) + parts[1].zfill(4) + parts[2].zfill(2)\\n    raise ValueError(f\\\"Ambiguous or invalid NDC: {value!r}\\\")\\n\\n\\ndef flag(value):\\n    value = str(value).strip().upper()\\n    if value in {\\\"Y\\\", \\\"1\\\"}:\\n        return True\\n    if value in {\\\"N\\\", \\\"0\\\"}:\\n        return False\\n    if value in {\\\"\\\", \\\"*\\\", \\\"NA\\\", \\\"N/A\\\"}:\\n        return None\\n    raise ValueError(f\\\"Invalid restriction flag: {value!r}\\\")\\n\\n\\ndef enrollment(value):\\n    value = str(value).strip()\\n    if value in {\\\"\\\", \\\"*\\\", \\\"**\\\", \\\"N/A\\\"} or \\\"10 or\\\" in value.lower():\\n        return None\\n    value = value.replace(\\\",\\\", \\\"\\\")\\n    if not value.isdigit():\\n        raise ValueError(f\\\"Invalid enrollment: {value!r}\\\")\\n    return int(value)\\n\\n\\ndef normalized_header(row):\\n    return {re.sub(r\\\"[^A-Z0-9]+\\\", \\\"_\\\", str(k).strip().upper()).strip(\\\"_\\\"): str(v or \\\"\\\").strip()\\n            for k, v in row.items() if k is not None}\\n\"}")
          root=pathlib.Path('payer-access-intelligence')
          for name,content in files.items():
           p=root/name
           p.parent.mkdir(parents=True,exist_ok=True)
           p.write_text(content,encoding='utf-8')
          p=root/'tools/export_transport.py'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text("\"\"\"Export small, hash-verified source slices from a complete CI acquisition.\n\nOriginal archive hashes and full row counts remain in the manifest. This is not\nan independent second source: the slices are derivatives of the downloaded CMS files.\n\"\"\"\nimport csv\nimport json\nimport os\nimport shutil\nfrom pathlib import Path\n\nfrom pai.config import ROOT\nfrom pai.io import dump_json, sha256\nfrom pai.normalize import text_encoding\n\n\ndef export():\n    raw = ROOT / 'data' / 'raw'\n    out = ROOT.parent / '_payer_source_transport'\n    out.mkdir(exist_ok=True)\n    manifest = json.loads((raw / 'manifest.json').read_text())\n    manifest['transport'] = 'filtered'\n    manifest['ci_run_url'] = f\"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\"\n    catalog = json.loads((raw / 'products' / 'catalog.json').read_text())\n    codes = {x['rxcui'] for x in catalog}\n    manifest['transport_files'] = []\n    for snap in manifest['snapshots']:\n        month = snap['month']\n        folder = out / month\n        folder.mkdir(exist_ok=True)\n        snap['full_row_counts'] = {}\n        fids = set()\n        for filename, delim in [('plans.txt','|'),('formulary.txt','|'),('enrollment.csv',','),('indications.txt','|')]:\n            src = raw / month / filename\n            if not src.exists():\n                continue\n            with src.open(encoding=text_encoding(src), newline='') as f, (folder / filename).open('w',encoding='utf-8-sig',newline='') as dest:\n                reader = csv.DictReader(f,delimiter=delim)\n                w = csv.DictWriter(dest, fieldnames=[*reader.fieldnames,'ORIGINAL_SOURCE_ROW'],delimiter=delim)\n                w.writeheader()\n                n = 0\n                for i,row in enumerate(reader,2):\n                    n += 1\n                    clean = {k.strip().upper().replace(' ','_'):v.strip() for k,v in row.items()}\n                    if filename == 'formulary.txt':\n                        fids.add(clean['FORMULARY_ID'])\n                        retain = clean['RXCUI'] in codes\n                    elif filename == 'indications.txt':\n                        retain = clean['RXCUI'] in codes\n                    else:\n                        retain = clean.get('CONTRACT_ID',clean.get('CONTRACT_NUMBER','')).startswith('S')\n                    if retain:\n                        w.writerow({**row,'ORIGINAL_SOURCE_ROW':i})\n                snap['full_row_counts'][filename] = n\n            manifest['transport_files'].append({'path':f'{month}/{filename}','sha256':sha256(folder/filename)})\n        dump_json(folder/'formulary_ids.json',sorted(fids))\n        manifest['transport_files'].append({'path':f'{month}/formulary_ids.json','sha256':sha256(folder/'formulary_ids.json')})\n    (out/'products').mkdir(exist_ok=True)\n    shutil.copyfile(raw/'products'/'catalog.json',out/'products'/'catalog.json')\n    manifest['transport_files'].append({'path':'products/catalog.json','sha256':sha256(out/'products'/'catalog.json')})\n    dump_json(out/'manifest.json',manifest)\n    print('Transport complete',out)\n\n\nif __name__ == '__main__':\n    export()\n\r\n",encoding='utf-8')
          
      - name: Acquire original CMS and NLM sources
        env:
          PYTHONPATH: payer-access-intelligence/src
        run: |
          python -c "from pai.fetch import fetch; fetch()"
          python payer-access-intelligence/tools/export_transport.py
      - name: Retain acquisition receipts on this isolated branch
        if: always()
        run: |
          mkdir -p _payer_source_transport
          if [ -f payer-access-intelligence/data/raw/acquisition-status.json ]; then cp payer-access-intelligence/data/raw/acquisition-status.json _payer_source_transport/; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _payer_source_transport
          git diff --cached --quiet || git commit -m "Record payer access source acquisition and verified slices"
          git push origin HEAD:work/payer-access-source-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payer-access-source-receipts
          path: _payer_source_transport
